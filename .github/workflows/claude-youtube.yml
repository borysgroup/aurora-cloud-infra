name: Claude Code (YouTube admin)

# A separate, deliberately small workflow for anything that needs FULL control
# of the Aurora PCL Hardware Streams YouTube channel (delete, edit, playlists,
# captions). Plain @claude runs only get the upload + read token; see CLAUDE.md.
#
# Three gates, any one of which stops a run:
#   1. The `if:` below: only @claude-youtube, and only from sgbaird.
#   2. The `youtube-admin` environment requires sgbaird to approve every run
#      (Actions tab -> the waiting run -> Review deployments). This is the gate
#      that holds even if someone edits this file: main is unprotected, and
#      GitHub allows no push (file path) rules on public repos.
#   3. That environment only deploys from main, so a workflow pushed on any
#      other branch cannot read its secret.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude-youtube:
    if: |
      github.actor == 'sgbaird' && (
        (github.event_name != 'issues' && contains(github.event.comment.body, '@claude-youtube')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude-youtube') || contains(github.event.issue.title, '@claude-youtube')))
      )
    runs-on: ubuntu-latest
    environment: youtube-admin
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Environment secret (youtube-admin): full control of Aurora PCL
          # Hardware Streams, including delete.
          YOUTUBE_TOKEN_PICKLE_B64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_B64 }}
          # Repo secret: upload + read only, the same one every @claude run gets.
          YOUTUBE_UPLOAD_TOKEN_PICKLE_B64: ${{ secrets.YOUTUBE_UPLOAD_TOKEN_PICKLE_B64 }}
          BASH_DEFAULT_TIMEOUT_MS: "900000"
          BASH_MAX_TIMEOUT_MS: "3600000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude-youtube"
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5 --effort max
            --permission-mode bypassPermissions
