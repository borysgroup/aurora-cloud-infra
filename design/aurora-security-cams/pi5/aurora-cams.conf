# /etc/chrony/conf.d/aurora-cams.conf on the Pi 5 (chrony replaced systemd-timesyncd, 2026-11-19).
# Serve NTP to the Amcrest cameras on eth0's segment (192.168.3.199 is the Pi there); they have no
# internet path, so the Pi is their only time source. Nothing outside this subnet is served.
allow 192.168.3.0/24
